name: Build and Deploy Docker Image for Django Server

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'gadmin/**'
      - '.github/workflows/deploy.yaml'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'ops/storage-monitoring/**'
      - 'ops/product-thumbnails/**'
      - 'ops/deal-categories/**'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build django image on VM
        uses: appleboy/ssh-action@master
        timeout-minutes: 60
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_HOST,DATABASE_NAME,DATABASE_PASSWORD,DATABASE_USER
          port: 22
          script: |
            set -e
            cd /home/docker/django/deploy/geteverything
            
            echo "[1] git fetch & reset"
            git fetch origin
            git reset --hard origin/main
            
            
            if ! command -v envsubst >/dev/null 2>&1; then
              sudo apt-get update -y || sudo yum update -y || true
              sudo apt-get install -y gettext-base || sudo yum install -y gettext || true
            fi
            echo "[2] Dockerfile template작성"
            envsubst < gadmin/uwsgi.ini.template > gadmin/uwsgi.ini

            echo "[3] docker build (캐시 자동 사용)"
            docker build \
              -t my-django-app \
              -f Dockerfile \
              .

            echo "이미지 빌드 종료"

      - name: Generate .env in docker/django
        run: |
          cat > django.env << 'EOF'
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_NAME=${{ secrets.DATABASE_NAME }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          EOF

      - name: Copy docker.env to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "django.env"
          target: /home/docker/django/

      - name: Restart Docker Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/docker/django
            test -d /var/lib/geteverything-storage/snapshots
            test -d /var/lib/geteverything-thumbnails/objects
            docker run --rm \
            --env-file django.env \
            my-django-app \
            python /app/gadmin/manage.py migrate --noinput
            docker stack rm django
            docker stack deploy -c docker-compose.yml \
              -c deploy/geteverything/ops/storage-monitoring/docker-compose.web.yml django
            sudo install -m 755 deploy/geteverything/ops/product-thumbnails/run.py /usr/local/lib/geteverything-thumbnails/run.py
            sudo install -m 644 deploy/geteverything/ops/product-thumbnails/geteverything-product-thumbnails.service /etc/systemd/system/geteverything-product-thumbnails.service
            sudo systemctl disable --now geteverything-product-thumbnails.timer
            sudo systemctl daemon-reload
            sudo systemctl enable geteverything-product-thumbnails.service
            sudo systemctl restart geteverything-product-thumbnails.service

      - name: Update category worker on crawler server
        uses: appleboy/ssh-action@master
        env:
          CATEGORY_DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.CRAWLER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: CATEGORY_DEPLOY_SHA
          script: |
            set -e
            git -C /home/crawler/build/geteverything fetch origin
            category_release_dir=$(mktemp -d /tmp/geteverything-categories.XXXXXX)
            git -C /home/crawler/build/geteverything archive "$CATEGORY_DEPLOY_SHA" | tar -x -C "$category_release_dir"
            sudo python3 "$category_release_dir/ops/deal-categories/deploy.py"
            rm -rf "$category_release_dir"
            
